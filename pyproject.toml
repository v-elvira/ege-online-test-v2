[project]
name = "ege-api"
version = "0.1.0"
description = "EGE API"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.41",
    "asyncpg>=0.30.0",
    "greenlet>=3.2.0",
    "email-validator>=2.2.0",
]

[tool.poetry]
packages = [{ include = "app" }]

[dependency-groups]
dev = [
    "ruff (>=0.17.3,<0.18.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Список правил, которые нужно проверять:
# E/W - Flake8, F - Pyflakes, I - isort (сортировка импортов), B - flake8-bugbear, pyupgrade (UP)
select = ["E", "W", "F", "I", "B", "UP"]
# Правила, которые нужно игнорировать
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
